
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banveer Store | Online Shopping</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Banveer<span>Store.</span></h1>
  <nav>
    <a href="#home">Home</a>
    <a href="#products">Products</a>
    <a href="#contact">Contact</a>
    <button id="cartButton">Cart 🛒 (<span id="cartCount">0</span>)</button>
  </nav>
</header>

<section class="hero" id="home">
  <div>
    <h2>Discover Your Style</h2>
    <p>Shop the latest products at amazing prices.</p>
    <a href="#products" class="shop-btn">Shop Now</a>
  </div>
</section>

<section class="products" id="products">
  <h2>Our Products</h2>
  <input type="text" id="searchInput"
         placeholder="Search products...">
  <div class="product-grid" id="productGrid"></div>
</section>

<section class="cart-section" id="cart">
  <h2>Your Shopping Cart</h2>
  <div id="cartItems">Your cart is empty.</div>
  <h3>Total: ₹<span id="cartTotal">0</span></h3>
  <button id="checkoutButton">Checkout</button>
</section>

<footer id="contact">
  <h2>Banveer Store</h2>
  <p>Thank you for shopping with us!</p>
  <p>© 2026 Banveer Store. All rights reserved.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
